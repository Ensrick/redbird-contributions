name: Contribution checks

on:
  push:
    branches: ['codex/owner-aware-inline-generator-ci-20261121']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: 'false'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  MSBUILDDISABLENODEREUSE: '1'

jobs:
  windows-tests:
    name: Windows ${{ matrix.architecture }} tests
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        architecture: [X64, X86]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Run upstream transaction and backend suites
        shell: pwsh
        run: ./scripts/ci/run-tests.ps1 -Architecture ${{ matrix.architecture }} -Configuration Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ matrix.architecture }}-test-results
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 7

  build-docs-config:
    name: Solution, documentation and configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Compile both library target frameworks
        run: |
          dotnet restore RedBird.slnx
          dotnet build RedBird.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - name: Build documentation with warnings as errors
        shell: pwsh
        run: ./scripts/ci/build-docs.ps1
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          package-manager-cache: false
      - name: Validate upstream release configuration without publishing
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run validate:config

  linux-tests:
    name: Linux X64 native and managed tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build and exercise the upstream signal and futex helper
        run: |
          sh src/RedBird.Core/native/linux-x64/build.sh
          gcc -O2 -std=gnu11 -Wall -Wextra -Werror -pthread -ldl -o /tmp/redbird_thread_patch_test src/RedBird.Core/native/linux-x64/redbird_thread_patch_test.c
          /tmp/redbird_thread_patch_test "$GITHUB_WORKSPACE/src/RedBird.Core/runtimes/linux-x64/native/libredbird_thread_patch.so"
      - name: Run upstream X64 suite
        shell: pwsh
        run: ./scripts/ci/run-tests.ps1 -Architecture X64 -Configuration Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-X64-test-results
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 7
