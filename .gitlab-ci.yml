# GitLab reads this file from top to bottom to decide which pipelines and jobs to create.
# Jobs are grouped into stages; every job in one stage must finish before the next stage
# normally starts. Jobs within the same stage may run in parallel when runners are available.

# Control when GitLab creates a pipeline at all.
workflow:
  rules:
    # Run a pipeline for merge requests so proposed changes are checked before merging.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Once a branch has an open merge request, use its merge-request pipeline and suppress the
    # duplicate branch pipeline that the same push would otherwise create.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    # Also run for commits on any branch. CI_COMMIT_BRANCH is set only for branch pipelines.
    - if: '$CI_COMMIT_BRANCH'

# Stages run in this order. The stage assigned to each job appears farther below.
stages:
  - validate
  - test
  - docs
  - package
  - release

# These environment variables are available to every job unless a job overrides them.
variables:
  # Fetch the complete Git history. semantic-release needs it to inspect earlier tags and commits.
  GIT_DEPTH: "0"
  # Keep .NET command output quiet and prevent CI runs from sending CLI telemetry.
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # Store restored NuGet packages inside the project directory so GitLab can cache them.
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  # NuGet trusted publishing exchanges the GitLab OIDC token at this endpoint. The resulting temporary API key is used against the V3 feed so symbol packages are published too.
  NUGET_TOKEN_ENDPOINT: "https://www.nuget.org/api/v2/token"
  NUGET_SOURCE: "https://api.nuget.org/v3/index.json"

# A cache speeds up later jobs and pipelines; it is not a build result. Build results that must be downloaded or passed to another job belong under "artifacts" instead.
cache:
  # Invalidate the cache when centrally managed package versions or NuGet sources change.
  key:
    prefix: "nuget"
    files:
      - Directory.Packages.props
      - nuget.config
  paths:
    - .nuget/packages/

# Job names can contain colons. This job validates repository configuration with the Node tools declared in package.json. `npm ci` installs exactly what package-lock.json specifies. 
# The second command requires package.json to define a script named "validate:config".
validate:config:
  stage: validate
  image: node:22.22.2-bookworm
  variables:
    # Keep npm's download cache inside the project so GitLab can preserve it between pipelines.
    NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  # Override the global NuGet cache: this Node-only job does not restore NuGet packages.
  cache:
    key:
      prefix: "npm"
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    # Auditing is a separate concern from deterministic installation and can make CI wait on the
    # public npm audit service. Dependency versions remain locked by package-lock.json.
    - npm ci --ignore-scripts --no-audit --no-fund
    - npm run validate:config

# Compile the complete solution once in Release mode. --no-restore is safe here because the preceding command restores packages in the same job. Each job otherwise starts in a clean image.
build:
  stage: validate
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - dotnet restore RedBird.slnx
    - dotnet build RedBird.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

# A job whose name begins with a dot is a hidden template: GitLab does not run it directly. The two Windows test jobs below inherit these shared settings with `extends`.
.windows-test:
  stage: test
  # This tag selects a GitLab Runner registered with the matching Windows tag.
  tags:
    - windows
  artifacts:
    # Upload results even when a test fails so the failure can still be investigated.
    when: always
    expire_in: 14 days
    paths:
      - artifacts/test-results/

# Run the test suite in a 64-bit process. The PowerShell script creates the JUnit report named here.
test:x64:
  extends: .windows-test
  script:
    - pwsh -NoProfile -File scripts/ci/run-tests.ps1 -Architecture X64 -Configuration Release
  artifacts:
    # GitLab parses JUnit reports and displays individual test results in the pipeline UI.
    reports:
      junit: artifacts/test-results/x64-junit.xml

# Run the same suite in a 32-bit process to cover architecture-specific code paths.
test:x86:
  extends: .windows-test
  script:
    - pwsh -NoProfile -File scripts/ci/run-tests.ps1 -Architecture X86 -Configuration Release
  artifacts:
    reports:
      junit: artifacts/test-results/x86-junit.xml

# Exercise the Linux signal/futex patch window on a real CLR process. 
# The native smoke test also verifies the ucontext ABI and the helper's no-write failure paths.
test:linux-x64:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends build-essential
  script:
    # Invoke the script through sh so a checkout made from a ZIP does not depend on Unix mode bits.
    - sh src/RedBird.Core/native/linux-x64/build.sh
    - gcc -O2 -std=gnu11 -Wall -Wextra -Werror -pthread -ldl -o /tmp/redbird_thread_patch_test src/RedBird.Core/native/linux-x64/redbird_thread_patch_test.c
    - /tmp/redbird_thread_patch_test "$CI_PROJECT_DIR/src/RedBird.Core/runtimes/linux-x64/native/libredbird_thread_patch.so"
    - dotnet restore src/RedBird.X64.Tests/RedBird.X64.Tests.csproj
    - dotnet build src/RedBird.X64.Tests/RedBird.X64.Tests.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true
    - dotnet bin/RedBird.X64.Tests/Release/net10.0/RedBird.X64.Tests.dll

# Build the API documentation and fail if Docfx reports a warning. The generated site is retained as an artifact so it can be inspected and, on the default branch, published by the pages job.
docs:
  stage: docs
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - dotnet restore RedBird.slnx
    - dotnet tool restore
    - dotnet tool run docfx docs/docfx.json --warningsAsErrors
  artifacts:
    expire_in: 14 days
    paths:
      - docs/_site/

# Produce NuGet packages with a unique CI-only version, then check their contents before upload.
package:
  stage: package
  image: mcr.microsoft.com/dotnet/sdk:10.0
  # This job rebuilds everything it packages, so it does not need test reports or the generated documentation downloaded from earlier jobs.
  dependencies: []
  before_script:
    # The Linux runtime companion is generated from C source; package validation needs unzip.
    - apt-get update && apt-get install -y --no-install-recommends build-essential unzip
  script:
    # CI_PIPELINE_IID is a project-local, increasing pipeline number.
    - export PACKAGE_VERSION="0.0.0-ci.$CI_PIPELINE_IID"
    # Jobs have isolated filesystems. Rebuild the native companion here instead of relying on the copy produced and exercised by test:linux-x64 in a different job.
    - sh src/RedBird.Core/native/linux-x64/build.sh
    - dotnet restore RedBird.slnx
    - dotnet build RedBird.slnx -c Release --no-restore -p:Version="$PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true
    - dotnet pack RedBird.slnx -c Release --no-build --no-restore -p:PackageVersion="$PACKAGE_VERSION" --output artifacts/packages
    - bash scripts/ci/validate-packages.sh "$PACKAGE_VERSION"
  artifacts:
    expire_in: 14 days
    paths:
      - artifacts/packages/

# Publish the generated documentation with GitLab Pages.
pages:
  stage: package
  image: alpine:3.22
  needs:
    # Download the docs job's artifact rather than rebuilding the site.
    - job: docs
      artifacts: true
  script:
    # Give a clear failure if the expected Docfx entry page is missing.
    - test -f docs/_site/index.html
  pages:
    publish: docs/_site
  rules:
    # Only the default branch updates the public documentation site.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Create the real release after the required build, test, documentation, and package jobs succeed.
release:
  stage: release
  image: node:22.22.2-bookworm
  # Ask GitLab for a short-lived token whose audience is only NuGet.org. NuGet.org exchanges this token for a temporary API key
  id_tokens:
    NUGET_ID_TOKEN:
      aud: "https://www.nuget.org"
  # The environment claim can be bound in the NuGet trusted-publishing policy and protected in GitLab. 
  # It also makes production publishing visible in GitLab's deployment history.
  environment:
    name: nuget.org
    deployment_tier: production
  # Never run two publishers concurrently, even if two default-branch pipelines overlap.
  resource_group: nuget.org
  interruptible: false
  # GitLab uses the job timeout as the ID token lifetime. This leaves enough time to install the SDK and prepare release artifacts before the one-time NuGet token exchange.
  timeout: 45 minutes
  # `needs` declares the exact prerequisites. These entries deliberately skip artifact downloads:
  # semantic-release rebuilds the final version after it has calculated the release number.
  needs:
    - job: validate:config
      artifacts: false
    - job: build
      artifacts: false
    - job: test:x64
      artifacts: false
    - job: test:x86
      artifacts: false
    - job: test:linux-x64
      artifacts: false
    - job: docs
      artifacts: false
    - job: package
      artifacts: false
  before_script:
    # This job needs both Node (for semantic-release) and .NET (for the release scripts), so the .NET SDK is installed into the otherwise Node-focused image.
    # build-essential compiles the Linux runtime companion again for the final release packages.
    - apt-get update && apt-get install -y --no-install-recommends build-essential ca-certificates curl git jq unzip zip libicu-dev
    - curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
    - bash /tmp/dotnet-install.sh --channel 10.0 --install-dir "$CI_PROJECT_DIR/.dotnet"
    - export PATH="$CI_PROJECT_DIR/.dotnet:$PATH"
    - npm ci --ignore-scripts --no-audit --no-fund
  script:
    # Use the repository-pinned semantic-release installation rather than allowing npx to download a different version. 
    # NUGET_USERNAME must be configured as a protected CI/CD variable.
    - npm run release
  rules:
    # Release only for a direct push to the default branch, never from a merge-request pipeline.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
